# Vhost Nginx pour exposer FoxBaby (à adapter puis placer sur le Pi dans
# /etc/nginx/sites-available/foxbaby, avec un lien dans sites-enabled/).
#
# Ce fichier ne concerne QUE FoxBaby : vos autres sites restent inchangés.
# Remplacez foxbaby.fg-tech.fr par votre (sous-)domaine réel.
#
# Étapes sur le Pi :
#   1. sudo cp docker/nginx-foxbaby.conf /etc/nginx/sites-available/foxbaby
#   2. (éditez le server_name)
#   3. sudo ln -s /etc/nginx/sites-available/foxbaby /etc/nginx/sites-enabled/
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. sudo certbot --nginx -d foxbaby.fg-tech.fr
#      → certbot ajoute automatiquement le bloc HTTPS (443) + la redirection 80→443.

server {
    listen 80;
    listen [::]:80;
    server_name foxbaby.fg-tech.fr;

    # Proxifie tout vers la stack FoxBaby (Caddy en local, qui sert le front et /api).
    # Le port doit correspondre à FOXBABY_HTTP_PORT de deploy.env.
    location / {
        proxy_pass http://127.0.0.1:6010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
