# Stack FoxBaby self-hosted : Postgres + backend Node + Caddy (front + reverse-proxy).
#
# Dev local (backend/front lancés à la main) :
#   docker compose up -d postgres
#
# Stack complète (tout en conteneurs) :
#   docker compose up -d --build            # → http://localhost:8080
#
# Prod (domaine + HTTPS) : surcharger via un fichier d'env, ex.
#   docker compose --env-file deploy.env up -d --build
# (voir deploy.env.example)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foxbaby}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foxbaby}
      POSTGRES_DB: ${POSTGRES_DB:-foxbaby}
    ports:
      # Écoute locale uniquement (jamais exposé publiquement, même sur un Pi partagé).
      - "${FOXBABY_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foxbaby} -d ${POSTGRES_DB:-foxbaby}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-foxbaby}:${POSTGRES_PASSWORD:-foxbaby}@postgres:5432/${POSTGRES_DB:-foxbaby}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      PORT: "3000"
    ports:
      # Publié en local uniquement (accès direct/debug de l'API ; l'app passe par
      # /api via Caddy, ce port n'est pas nécessaire à son fonctionnement).
      - "${FOXBABY_API_PORT:-3000}:3000"

  caddy:
    build:
      context: .
      dockerfile: docker/Caddy.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      # Écoute en local seulement : c'est le Nginx de l'hôte qui expose le
      # sous-domaine en HTTPS et proxifie vers ce port. (Le HTTPS n'est donc PAS
      # géré par Caddy ici.) En dev local, accessible via http://localhost:8080.
      - "${FOXBABY_HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  pgdata:
